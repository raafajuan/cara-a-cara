<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cara a Cara Multiverso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Lilita+One&display=swap">
<style>
/* Layout: a toy-box table — the player's plastic tray (red or blue) holds a grid of flip-down portrait cards; controls sit above it like the game's lid. */
:root{
  --bg:#e6ebf2;
  --surface:#ffffff;
  --ink:#1c2230;
  --muted:#5a6477;
  --line:#cdd5e1;
  --red:#d8433a; --red-deep:#9f2c25;
  --blue:#2f6ad4; --blue-deep:#1c4596;
  --tray:var(--red); --tray-deep:var(--red-deep);
  --card:#fbfcfe; --card-ink:#1c2230; --card-muted:#5a6477; --card-edge:#d6dde8;
  --gold:#f1b531;
  --ok:#2f9d5a;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 6px 18px rgba(20,30,50,.08);
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#1a2130; --ink:#e8ecf4; --muted:#9ba6ba; --line:#2b3447;
  --red:#e0544b; --red-deep:#a3332c; --blue:#3f7ae0; --blue-deep:#234f9e;
  --card:#f3f5f9; --card-edge:#c7cfdb; --gold:#f3bd45; --ok:#4cb877;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#1a2130; --ink:#e8ecf4; --muted:#9ba6ba; --line:#2b3447;
  --red:#e0544b; --red-deep:#a3332c; --blue:#3f7ae0; --blue-deep:#234f9e;
  --card:#f3f5f9; --card-edge:#c7cfdb; --gold:#f3bd45; --ok:#4cb877;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px 40px}
body.tray-blue{--tray:var(--blue);--tray-deep:var(--blue-deep)}
#app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.35rem}
h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.6em 1.15em;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:42px;transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--tray);border-color:var(--tray-deep);color:#fff;box-shadow:0 3px 0 var(--tray-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--tray-deep)}
.btn.on{background:var(--gold);border-color:#b8861b;color:#2a1f05}
.btn.small{min-height:36px;padding:.45em .9em;font-size:.9rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- Home ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-size:clamp(2rem,6vw,3.1rem);line-height:1;color:var(--tray);text-shadow:0 3px 0 var(--tray-deep)}
.tag{font-family:var(--font-display);font-size:1.05rem;background:var(--gold);color:#2a1f05;padding:.15em .55em;border-radius:6px;transform:rotate(-3deg);display:inline-block}
.tray-pick{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.swatch{width:38px;height:38px;border-radius:10px;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.swatch.red{background:var(--red)}.swatch.blue{background:var(--blue)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.section-head p{color:var(--muted);font-size:.92rem}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pack{appearance:none;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.pack:hover{transform:translateY(-2px)}
.pack[aria-pressed="true"]{border-color:var(--tray);box-shadow:0 0 0 3px color-mix(in srgb,var(--tray) 30%,transparent),var(--shadow)}
.pack-faces{display:flex;background:var(--pack-bg);border-radius:10px;padding:6px 8px 0;height:74px;overflow:hidden}
.pack-faces svg{width:62px;height:68px;margin-right:-16px;flex:none}
.pack-name{font-family:var(--font-display);font-size:1.12rem;line-height:1.1}
.pack-meta{font-size:.8rem;color:var(--muted)}
.pack-tag{font-size:.84rem;color:var(--muted);line-height:1.3}

.play{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.play-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.play-card p{color:var(--muted)}
.join{display:flex;flex-direction:column;gap:6px}
.join label{font-weight:700;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 150px;min-width:0}
input[type=text]{font:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.55em .8em;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:42px}
.err{color:var(--red);font-size:.88rem;min-height:1.2em}
.how ol{margin:0;padding-left:1.3em;display:grid;gap:6px;color:var(--muted);max-width:68ch}
.how b{color:var(--ink)}

/* ---------- Game ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar-mid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.pack-label{font-family:var(--font-display);font-size:1.25rem}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.25em .35em .25em .8em;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip code{font-family:inherit;letter-spacing:.08em;user-select:all}
.chip .btn{min-height:28px;padding:.2em .7em;font-size:.8rem}
.round{font-weight:700;color:var(--muted);font-size:.9rem}

.hud{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.secret{appearance:none;border:none;background:none;padding:0;cursor:pointer;width:92px;aspect-ratio:3/4;perspective:600px}
.secret .inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.secret.open .inner{transform:rotateY(180deg)}
.secret .s-face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.secret .s-back{background:var(--tray-deep);color:#fff;font-weight:700;font-size:.72rem;text-align:center;padding:6px;line-height:1.2;gap:4px;background-image:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.6px);background-size:10px 10px}
.secret .s-back .q{font-family:var(--font-display);font-size:2rem;line-height:1}
.secret .s-front{transform:rotateY(180deg);background:var(--card);border:2px solid var(--gold);color:var(--card-ink)}
.secret .s-front .portrait{width:100%;flex:1;background:var(--pack-bg);display:flex;align-items:flex-end;justify-content:center}
.secret .s-front svg{width:92%;height:auto}
.secret .s-front .nm{font-weight:800;font-size:.72rem;padding:3px 4px;text-align:center;line-height:1.1}
.hud-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.hud-info .big{font-family:var(--font-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.hud-info .big small{font-family:var(--font-body);font-size:.9rem;font-weight:600;color:var(--muted)}
.hud-info .sub{color:var(--muted);font-size:.88rem}
.hud-actions{display:flex;flex-direction:column;gap:8px}
.solo-note{font-size:.85rem;color:var(--muted);max-width:30ch}

.tray{background:var(--tray);border-radius:22px;padding:14px;box-shadow:inset 0 -8px 0 var(--tray-deep),inset 0 3px 0 rgba(255,255,255,.18),var(--shadow)}
.tray.guessing{outline:4px dashed var(--gold);outline-offset:4px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
@media (min-width:640px){.board{grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}}
@media (min-width:1000px){.board{grid-template-columns:repeat(8,minmax(0,1fr))}}
.card{appearance:none;border:none;background:none;padding:0;cursor:pointer;aspect-ratio:3/4.1;perspective:700px;display:block;width:100%}
.card .inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.35,1.25,.5,1)}
.card.down .inner{transform:rotateX(-180deg)}
.face{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column}
.front{background:var(--card);border:2px solid var(--card-edge);color:var(--card-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.front .portrait{flex:1;min-height:0;background:var(--pack-bg);display:flex;align-items:flex-end;justify-content:center}
.front svg{width:94%;height:auto;max-height:100%}
.front .nm{font-weight:800;font-size:clamp(.62rem,1.9vw,.8rem);line-height:1.1;padding:4px 4px 1px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .meta{font-size:clamp(.52rem,1.5vw,.66rem);color:var(--card-muted);text-align:center;padding:0 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{transform:rotateX(180deg);background:var(--tray-deep);border:2px solid rgba(0,0,0,.18);align-items:center;justify-content:center;background-image:radial-gradient(rgba(255,255,255,.13) 1.5px,transparent 1.6px);background-size:9px 9px}
.back span{font-family:var(--font-display);color:rgba(255,255,255,.55);font-size:1.6rem}
.card:not(.down):hover .front{border-color:var(--gold)}
.tray.guessing .card:not(.down) .front{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}

.score{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.score .side{display:flex;align-items:center;gap:8px}
.score input{width:9ch;text-transform:none;letter-spacing:0;min-height:36px;padding:.35em .6em}
.score .pts{font-family:var(--font-display);font-size:1.8rem;font-variant-numeric:tabular-nums;min-width:1.4ch;text-align:center}
.score .x{font-family:var(--font-display);color:var(--muted)}
.score-label{width:100%;text-align:center;font-size:.82rem;color:var(--muted)}

/* ---------- Dialog ---------- */
dialog{border:none;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:min(86vh,760px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,22,.55)}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.dlg-body{padding:0 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line)}
.x-btn{appearance:none;border:none;background:var(--bg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.2rem;line-height:1;color:var(--ink)}
.qsearch{text-transform:none!important;letter-spacing:0!important;font-weight:600!important;width:100%}
.qgroup h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px}
.q{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:.6em .8em;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.q:hover{border-color:var(--tray)}
.q .split{font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.q.useless{opacity:.45}
.answer-q{font-family:var(--font-display);font-size:1.5rem;text-align:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers .btn{min-height:64px;font-size:1.1rem;border-radius:14px;flex-direction:column;gap:2px}
.answers .btn small{font-weight:600;font-size:.78rem;opacity:.85}
.verdict{font-family:var(--font-display);font-size:2.4rem;text-align:center}
.verdict.yes{color:var(--ok)}.verdict.no{color:var(--red)}
.traits{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.traits dt{color:var(--muted);font-weight:600}
.traits dd{margin:0;font-weight:700}
.big-portrait{display:flex;gap:14px;align-items:center}
.big-portrait .pf{width:110px;flex:none;border-radius:12px;background:var(--pack-bg);border:2px solid var(--gold);overflow:hidden;display:flex;align-items:flex-end}
.big-portrait .pf svg{width:100%;height:auto}
.big-portrait h3{font-size:1.5rem}
.muted{color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:.65em 1.1em;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .hud{grid-template-columns:auto 1fr;}
  .hud-actions{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap}
  .hud-actions .btn{flex:1 1 auto}
  .secret{width:78px}
  .tray{padding:10px;border-radius:18px}
}
@media (prefers-reduced-motion:reduce){
  .card .inner,.secret .inner,.btn,.pack{transition:none}
}
</style>

<div id="app" aria-live="off"></div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}

  }

  s+=`<path d="M13,100 Q15,79 50,77 Q85,79 87,100Z" fill="${cloth}"/>`;
  s+=`<path d="M43,66 L57,66 L58,80 Q50,84 42,80Z" fill="${skinD}"/>`;
  // orelhas
  if(x.has("orelhas")) s+=`<path d="M29,49 L10,33 L28,61Z" fill="${skin}"/><path d="M71,49 L90,33 L72,61Z" fill="${skin}"/>`;

/* ============================ SORTEIO ============================ */
function seedFrom(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seedStr){const r=rng(seedFrom(seedStr)),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const CODE_CHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode(pack){let s="";for(let i=0;i<4;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return pack.code+"-"+s}
function parseCode(raw){
  const t=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const m=t.match(/^([A-Z]{3})([A-Z0-9]{4})$/);
  if(!m) return null;
  const pack=packByCode(m[1]);
  return pack?{pack,code:m[1]+"-"+m[2]}:null;
}
const BOARD_SIZE=24;

/* ============================ ESTADO ============================ */
const KEY="cac.v1";
const store={get(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};
function fresh(){return{screen:"home",packId:"tra",tray:"red",mode:null,code:null,round:1,board:[],down:[],secret:null,ai:null,asked:0,guessing:false,reveal:false,score:{me:0,them:0,meName:"Você",themName:"Oponente"}}}
let S;

function save(){store.set(S)}
function pack(){return packById(S.packId)}
function char(id){return pack().byId[id]}
function standing(){const d=new Set(S.down);return S.board.filter(id=>!d.has(id))}

function startGame(mode,code){
  const p=parseCode(code).pack;
  Object.assign(S,{screen:"game",mode,code,packId:p.id,round:1});
  buildRound();
}
function buildRound(){
  const p=pack();
  S.board=shuffled(p.list.map(c=>c.id),S.code+"#"+S.round).slice(0,BOARD_SIZE);
  S.down=[];S.asked=0;S.guessing=false;S.reveal=false;
  S.secret=S.board[Math.floor(Math.random()*S.board.length)];
  S.ai=S.mode==="solo"?S.board[Math.floor(Math.random()*S.board.length)]:null;
  save();render();
}

/* ============================ PERGUNTAS ============================ */
function questions(){
  const p=pack(),cs=S.board.map(id=>p.byId[id]),qs=[];
  const add=(group,label,test)=>{const n=cs.filter(test).length;if(n>0&&n<cs.length)qs.push({key:group+"|"+label,group,label,test})};
  add("Pessoa","É homem?",c=>c.g==="m");
  for(const k in SKIN_Q) add("Pessoa",SKIN_Q[k],c=>c.skin===k);
  add("Cabelo","É careca?",c=>c.style==="careca");
  for(const k in HAIR_NAME) add("Cabelo",`Tem cabelo ${HAIR_NAME[k]}?`,c=>c.style!=="careca"&&c.hair===k);
  for(const k in STYLE_Q) add("Cabelo",STYLE_Q[k],c=>c.style===k);
  for(const k in EYE_NAME) add("Olhos",`Tem olhos ${EYE_NAME[k]}?`,c=>c.eyes===k);
  const cat=e=>EXTRA_CAT[e]||e;
  for(const k in EXTRA_Q) add("Rosto e acessórios",EXTRA_Q[k],c=>c.extras.some(e=>cat(e)===k));
  for(const k in CLOTH_NAME) add("Roupa",`Veste roupa ${CLOTH_NAME[k]}?`,c=>c.cloth===k);
  p.attrs.forEach(a=>{[...new Set(p.list.map(c=>c.attrs[a]))].forEach(v=>add(p.name,`${a}: ${v}?`,c=>c.attrs[a]===v))});
  return qs;
}
function traitRows(c){
  const p=pack(),rows=[["Gênero",c.g==="m"?"Homem":"Mulher"]];
  if(SKIN_NAME[c.skin]) rows.push(["Pele",SKIN_NAME[c.skin]]);
  rows.push(["Cabelo",c.style==="careca"?"careca":`${HAIR_NAME[c.hair]}, ${STYLE_NAME[c.style]}`]);
  rows.push(["Olhos",c.extras.includes("venda")?"cobertos pela venda":EYE_NAME[c.eyes]]);
  rows.push(["No rosto",c.extras.length?c.extras.map(e=>EXTRA_NAME[e]).join(", "):"nada"]);
  rows.push(["Roupa",CLOTH_NAME[c.cloth]]);
  p.attrs.forEach(a=>rows.push([a,c.attrs[a]]));
  return rows;
}

function openDialog(title,body,foot=""){
  dlg.innerHTML=`<div class="dlg"><div class="dlg-head"><h2 id="dlgTitle">${title}</h2><button class="x-btn" data-act="close" aria-label="Fechar">×</button></div><div class="dlg-body">${body}</div>${foot?`<div class="dlg-foot">${foot}</div>`:""}</div>`;
  if(!dlg.open) dlg.showModal();
}
function closeDialog(){if(dlg.open)dlg.close()}

let QS=[],curQ=null;
function openAsk(){
  QS=questions();
  const up=standing().map(char);
  const groups=[...new Set(QS.map(q=>q.group))];
  const body=`<input type="text" class="qsearch" id="qsearch" placeholder="Buscar pergunta (ex.: chapéu, loiro, Ionia)" aria-label="Buscar pergunta">
  ${groups.map(g=>`<div class="qgroup" data-g="${esc(g)}"><h4>${esc(g)}</h4><div class="qlist">${QS.filter(q=>q.group===g).map(q=>{
    const yes=up.filter(q.test).length,no=up.length-yes,useless=yes===0||no===0;
    return `<button class="q ${useless?"useless":""}" data-act="q" data-k="${esc(q.key)}"><span>${esc(q.label)}</span><span class="split">${useless?"não ajuda":`sim ${yes} · não ${no}`}</span></button>`}).join("")}</div></div>`).join("")}`;
  openDialog(S.mode==="solo"?"Perguntar ao computador":"O que você perguntou?",body);
}
function pickQuestion(key){
  curQ=QS.find(q=>q.key===key);if(!curQ)return;
  const up=standing().map(char),yes=up.filter(curQ.test).length,no=up.length-yes;
  if(S.mode==="solo"){
    const ans=curQ.test(char(S.ai));
    const n=applyAnswer(curQ,ans);
    openDialog("Resposta do computador",`<p class="answer-q">${esc(curQ.label)}</p><p class="verdict ${ans?"yes":"no"}">${ans?"Sim":"Não"}</p><p class="muted" style="text-align:center">${n} ${n===1?"carta baixada":"cartas baixadas"}. Restam ${standing().length}.</p>`,`<button class="btn" data-act="ask">Outra pergunta</button><button class="btn primary" data-act="close">Voltar ao tabuleiro</button>`);
    return;
  }
  openDialog("Qual foi a resposta?",`<p class="answer-q">${esc(curQ.label)}</p>
    <div class="answers"><button class="btn" data-act="ans" data-v="1">Sim<small>baixa ${no}</small></button><button class="btn" data-act="ans" data-v="0">Não<small>baixa ${yes}</small></button></div>
    <p class="muted">As cartas que não combinam com a resposta vão baixar sozinhas.</p>`,`<button class="btn ghost" data-act="ask">← Escolher outra</button>`);
}
function applyAnswer(q,ans){
  const toDown=standing().filter(id=>q.test(char(id))!==ans);
  S.down.push(...toDown);S.asked++;save();render();
  return toDown.length;
}

  const c=char(S.secret),p=pack();
  openDialog("Seu personagem",`<div class="big-portrait" style="--pack-bg:${p.bg}"><div class="pf">${avatar(c)}</div><div><h3>${esc(c.name)}</h3><p class="muted">Use esta ficha para responder as perguntas. Não mostre para o oponente.</p></div></div>
  <dl class="traits">${traitRows(c).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`,`<button class="btn primary" data-act="close">Fechar</button>`);
}
function guess(id){
  const c=char(id),ai=char(S.ai);
  if(id===S.ai){
    S.guessing=false;save();render();
    openDialog("Acertou!",`<div class="big-portrait" style="--pack-bg:${pack().bg}"><div class="pf">${avatar(ai)}</div><div><h3>${esc(ai.name)}</h3><p class="muted">Você descobriu com ${S.asked} ${S.asked===1?"pergunta":"perguntas"}.</p></div></div>`,`<button class="btn" data-act="home">Início</button><button class="btn primary" data-act="newsolo">Novo treino</button>`);
  }else{
    S.down.push(id);S.asked++;S.guessing=false;save();render();
    toast(`Não é ${c.name}. Conta como mais uma pergunta.`);
  }
}

/* ============================ EVENTOS ============================ */
function onClick(e){
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  switch(act){
    case "tray":S.tray=b.dataset.v;save();render();break;
    case "pack":S.packId=b.dataset.id;save();render();break;
    case "create":startGame("duo",newCode(pack()));toast("Passe o código "+S.code+" para quem vai jogar com você");break;
    case "solo":startGame("solo",newCode(pack()));break;
    case "newsolo":closeDialog();S.code=newCode(pack());S.round=1;buildRound();break;
    case "home":closeDialog();S.screen="home";save();render();break;
    case "copy":{const t=S.code;
      const sel=()=>{const el=document.getElementById("codeText");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Código selecionado. Copie com Ctrl+C ou segurando o dedo.")};
      try{navigator.clipboard.writeText(t).then(()=>toast("Código copiado"),sel)}catch(err){sel()}break;}
    case "newround":openDialog("Começar a rodada "+(S.round+1)+"?",`<p>O tabuleiro muda e você recebe um novo personagem secreto. A outra pessoa também precisa tocar em <b>Nova rodada</b> para os tabuleiros continuarem iguais.</p>`,`<button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" data-act="confirmround">Começar rodada ${S.round+1}</button>`);break;
    case "confirmround":closeDialog();S.round++;buildRound();toast("Rodada "+S.round);break;
    case "reveal":S.reveal=!S.reveal;save();render();if(S.reveal){clearTimeout(revealT);revealT=setTimeout(()=>{if(S.reveal){S.reveal=false;save();render()}},5000)}break;
    case "details":openDetails();break;
    case "ask":openAsk();break;
    case "q":pickQuestion(b.dataset.k);break;
    case "ans":{const n=applyAnswer(curQ,b.dataset.v==="1");closeDialog();toast(`${n} ${n===1?"carta baixada":"cartas baixadas"} · restam ${standing().length}`);break;}
    case "guess":S.guessing=!S.guessing;save();render();break;
    case "card":{const id=b.dataset.id,i=S.down.indexOf(id);
      if(S.mode==="solo"&&S.guessing){if(i<0)guess(id);break;}
      if(i>=0)S.down.splice(i,1);else S.down.push(id);save();render();break;}
    case "pt":S.score[b.dataset.v]++;save();render();break;
    case "resetscore":S.score.me=0;S.score.them=0;save();render();break;
    case "close":closeDialog();break;
  }
}
let revealT;
document.addEventListener("click",e=>{if(e.target===dlg){closeDialog();return}onClick(e)});
document.addEventListener("submit",e=>{
  if(e.target.id!=="joinForm")return;
  e.preventDefault();
  const v=document.getElementById("codeInput").value,parsed=parseCode(v),err=document.getElementById("joinErr");
  if(!parsed){err.textContent="Código inválido. Ele tem 3 letras da extensão e 4 caracteres, como LOL-K7Q2.";return}
  startGame("duo",parsed.code);toast("Entrou na partida "+parsed.code+" · "+parsed.pack.name);
});
document.addEventListener("input",e=>{
  if(e.target.id==="qsearch"){
    const t=e.target.value.trim().toLowerCase();
    dlg.querySelectorAll(".q").forEach(q=>{q.hidden=t&&!q.textContent.toLowerCase().includes(t)});
    dlg.querySelectorAll(".qgroup").forEach(g=>{g.hidden=![...g.querySelectorAll(".q")].some(q=>!q.hidden)});
  }
  if(e.target.id==="meName"||e.target.id==="themName"){S.score[e.target.id]=e.target.value.slice(0,12);save()}
});

/* ============================ INÍCIO ============================ */
function start(data){
  const saved=(data&&data.S)||store.get();
  S=Object.assign(fresh(),saved||{});
  S.score=Object.assign(fresh().score,S.score||{});
  if(S.screen==="game"&&(!S.board.length||!pack().byId[S.secret])) S.screen="home";
  render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
